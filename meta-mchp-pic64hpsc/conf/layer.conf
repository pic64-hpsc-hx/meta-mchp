# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mchp-pic64hpsc"
BBFILE_PATTERN_meta-mchp-pic64hpsc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mchp-pic64hpsc = "6"

LAYERDEPENDS_meta-mchp-pic64hpsc = "core meta-mchp-common"
LAYERSERIES_COMPAT_meta-mchp-pic64hpsc = "scarthgap"
